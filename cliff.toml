[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.raw_message | split(pat="\n") | first }}
{% endfor %}\
{% endfor %}
"""
trim = false
footer = "<!-- generated by git-cliff -->"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/civitaspo/rex-agent-relay/pull/${1}))" },
]
commit_parsers = [
    { message = '^chore\(release\):', skip = true },
    { message = '^feat', group = '<!-- 0 -->🚀 Features' },
    { message = '^fix', group = '<!-- 1 -->🐛 Bug Fixes' },
    { message = '^perf', group = '<!-- 2 -->⚡ Performance' },
    { message = '^docs', group = '<!-- 3 -->📚 Documentation' },
    { message = '^refactor', group = '<!-- 4 -->🚜 Refactoring' },
    { message = '^(chore|ci|build|test)', group = '<!-- 5 -->⚙️ Maintenance' },
    { message = '^revert', group = '<!-- 6 -->◀️ Reverts' },
    { message = '.*', group = '<!-- 7 -->💼 Other' },
]
filter_commits = false
topo_order_commits = true
sort_commits = "oldest"
