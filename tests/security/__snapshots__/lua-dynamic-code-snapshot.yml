id: lua-dynamic-code
snapshots:
  dofile(path):
    labels:
    - source: dofile(path)
      style: primary
      start: 0
      end: 12
  load(input):
    labels:
    - source: load(input)
      style: primary
      start: 0
      end: 11
  "load(input, \"chunk\", \"t\")":
    labels:
    - source: load(input, "chunk", "t")
      style: primary
      start: 0
      end: 25
  loadfile(path):
    labels:
    - source: loadfile(path)
      style: primary
      start: 0
      end: 14
  "loadfile(path, \"t\")":
    labels:
    - source: loadfile(path, "t")
      style: primary
      start: 0
      end: 19
  loadstring(input):
    labels:
    - source: loadstring(input)
      style: primary
      start: 0
      end: 17
  "loadstring(input, \"chunk\")":
    labels:
    - source: loadstring(input, "chunk")
      style: primary
      start: 0
      end: 26
