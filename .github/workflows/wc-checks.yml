name: Checks (workflow_call)
on:
  workflow_call:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.25"
          install_args: "--locked"
          cache: false
      - name: Lint
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: mise run lint
      - name: Verify action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run actions-lock-verify
