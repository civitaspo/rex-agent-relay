name: Checks (workflow_call)
on:
  workflow_call:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: "2026.10.25"
          install_args: "--locked"
          cache: false
      - name: Lint
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: mise run lint
      - name: Verify action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run actions-lock-verify
