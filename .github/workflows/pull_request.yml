name: CI
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/workflow_call_pr.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
  status-check:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful PR checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
