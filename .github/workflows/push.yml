name: Push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/workflow_call_push.yml
    permissions:
      contents: read
  push-status-check:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful push checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
